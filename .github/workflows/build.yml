name: CI Kernel Compilation

on:
  workflow_dispatch:
  push:
    branches:
      - "dev/cip"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provision build system & Toolchain
        run: |
          set -euo pipefail
          
          # Установка базового окружения
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libssl-dev make python3 zip unzip git curl patch zstd

          # Загрузка компилятора Sakura Clang
          mkdir -p toolchain
          curl -sSL "https://github.com/Madara273/Sakura-Clang-Compiler/releases/download/Sakura-Clang-R01/sakura-clang-24.0.0.tar.zst" | tar -I zstd -x -C toolchain/
          
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Apply KSU & Kernel Modifications
        run: |
          set -euo pipefail
          
          TARGET_CONFIG="arch/arm64/configs/vendor/fog_defconfig"

          # Подготовка ReSukiSU
          curl -sSL "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          # Включение конфигураций
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
          } >> "$TARGET_CONFIG"

          # Наложение патча Manual Hook
          curl -sSL "https://raw.githubusercontent.com/xxblebleblexx/manual_hook_fix/refs/heads/main/resuki-4.19-cip-st.patch" -o patch.patch
          patch -p1 < patch.patch

          # Установка nomount
          curl -sSL "https://raw.githubusercontent.com/xxblebleblexx/nomount-installer/refs/heads/installer/nomount.sh" | bash -s 4.19

      - name: Execute Kernel Build
        run: |
          set -euo pipefail
          
          mkdir -p build_logs
          
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export O=out
          
          MAKE_ARGS=(
            -j$(nproc --all)
            CC=clang
            LLVM=1
            LLVM_IAS=1
            LD=ld.lld
            AS=llvm-as
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
          )

          echo "TIMESTAMP_START=$(date +%s)" >> $GITHUB_ENV

          # Генерация конфигурации
          make "${MAKE_ARGS[@]}" vendor/fog_defconfig > build_logs/config.log 2>&1
          make "${MAKE_ARGS[@]}" olddefconfig > /dev/null 2>&1 || true

          # Запуск сборки
          if ! make "${MAKE_ARGS[@]}" > build_logs/compilation.log 2>&1; then
            echo "::error::Compilation failed! Check logs."
            tail -n 120 build_logs/compilation.log || true
            exit 1
          fi

          # Проверка результата
          IMAGE_PATH="out/arch/arm64/boot/Image.gz"
          if [[ ! -f "$IMAGE_PATH" ]]; then
            echo "::error::Target output file not found: $IMAGE_PATH"
            exit 1
          fi

          echo "IMAGE_OUTPUT=$IMAGE_PATH" >> $GITHUB_ENV

      - name: Package AnyKernel3 Zip
        run: |
          set -euo pipefail
          
          git clone --depth=1 https://github.com/Romeo13card/AnyKernel3.git ak3_workspace
          cp "$IMAGE_OUTPUT" ak3_workspace/Image.gz

          if [[ -f "out/arch/arm64/boot/dtbo.img" ]]; then
            cp out/arch/arm64/boot/dtbo.img ak3_workspace/dtbo.img
          fi

          PACKAGE_NAME="fog-Kadzuha-KSU-withoutSUSFS-$(date +%Y%m%d-%H%M).zip"
          ZIP_TARGET_PATH="/tmp/$PACKAGE_NAME"

          cd ak3_workspace
          zip -r9 "$ZIP_TARGET_PATH" . -x ".git*" "README.md"

          echo "AK3_ZIP_PATH=$ZIP_TARGET_PATH" >> $GITHUB_ENV

      - name: Generate Diagnostic Summary
        if: always()
        run: |
          set +e
          SUMMARY_FILE="$GITHUB_WORKSPACE/debug_report.txt"

          {
            echo "--- WORKFLOW METRICS ---"
            echo "Repo: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo
            echo "--- HARDWARE & OS ---"
            uname -a
            nproc --all
            free -h
            df -h .
            echo
            echo "--- COMPILER INFO ---"
            clang --version | head -n 3 || true
            echo
            echo "--- TAIL LOGS ---"
            tail -n 200 build_logs/compilation.log 2>/dev/null || echo "No log available"
          } > "$SUMMARY_FILE" 2>&1

          echo "DIAGNOSTIC_LOG=$SUMMARY_FILE" >> $GITHUB_ENV

      - name: Store Artifacts On GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            debug_report.txt
            build_logs/*.log
          retention-days: 7

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BUILD_START: ${{ env.TIMESTAMP_START }}
          BUILD_STATUS: ${{ job.status }}
          BUILD_FILE: ${{ env.IMAGE_OUTPUT }}
          ANYKERNEL_ZIP: ${{ env.AK3_ZIP_PATH }}
          DEBUG_REPORT_PATH: ${{ env.DIAGNOSTIC_LOG }}
        run: |
          python3 telegram_build.py
